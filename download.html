<style>
  :root{--paper:#f4efe3;--card:#fdfbf5;--ink:#2f2b26;--ink2:#6f6759;--hair:#d9d1bc;--cinnabar:#a63d2f;--indigo:#33505c;--gold:#a08444;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{background:var(--card);border:1px solid var(--hair);border-radius:3px;box-shadow:0 8px 24px -18px rgba(90,78,55,.25);padding:40px 36px;max-width:460px;width:100%;text-align:center;}
  .seal{width:52px;height:52px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--cinnabar);color:#f7efe2;font-size:26px;font-weight:900;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(247,239,226,.35);}
  h1{font-size:22px;letter-spacing:6px;font-weight:900;}
  .sub{font-size:12px;color:var(--ink2);letter-spacing:2.5px;margin-top:6px;}
  .rec{margin:22px 0 10px;font-size:13px;color:var(--gold);letter-spacing:3px;font-weight:600;}
  .btn{display:block;width:100%;font-family:inherit;cursor:pointer;font-size:16px;letter-spacing:4px;font-weight:600;color:#f7efe2;background:var(--cinnabar);border:none;border-radius:2px;padding:15px 20px;transition:.15s;text-decoration:none;text-align:center;}
  .btn:hover{background:#8f3327;}
  .btn:active{transform:translateY(1px);}
  .btn.sub2{background:var(--ink);}
  .btn.sub2:hover{background:#463f36;}
  .btn.gh{background:transparent;color:var(--indigo);border:1px solid var(--indigo);margin-top:10px;font-size:13.5px;padding:11px;}
  .how{background:rgba(160,132,68,.06);border:1px solid var(--hair);border-radius:3px;padding:14px 16px;margin-top:18px;font-size:12.5px;color:var(--ink2);line-height:2;text-align:left;}
  .how b{color:var(--ink);}
</style>
</head>
<body>
<div class="box">
  <div class="seal">法</div>

    若提示「题库未加载」，说明两者被分开了——把它们移回同一文件夹即可。

  <a class="btn gh" href="https://github.com/shaochidianhehe-glitch/shifa-fakao" target="_blank">GitHub 仓库 · 源码</a>
